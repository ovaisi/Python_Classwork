user  nginx;
worker_processes auto;            # Use all 4 cores
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    server_tokens   off;   # Hide Nginx version

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml+rss
        image/svg+xml;

    # Rate limiting
    limit_req_zone  $binary_remote_addr  zone=api:10m     rate=30r/m;
    limit_req_zone  $binary_remote_addr  zone=general:10m rate=120r/m;
    limit_conn_zone $binary_remote_addr  zone=addr:10m;

    # Upstream containers — Docker resolves these by service name
    upstream nextjs_upstream {
        server nextjs:3000;
        keepalive 32;
    }

    upstream strapi_upstream {
        server strapi:1337;
        keepalive 16;
    }

    upstream n8n_upstream {
        server n8n:5678;
        keepalive 8;
    }

    include /etc/nginx/conf.d/*.conf;
}
