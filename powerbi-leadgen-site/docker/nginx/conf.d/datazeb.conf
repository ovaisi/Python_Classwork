# ─────────────────────────────────────────────────────────────────────────────
# DataZeb — Nginx vhost config (Docker)
#
# Domains:
#   datazeb.com / www.datazeb.com  → Next.js container
#   datazeb.com/automation/        → n8n workflow automation
#   cms.datazeb.com                → Strapi container
#
# SSL: Let's Encrypt via Certbot container
#      First-time setup: see docker/DOCKER-GUIDE.md
# ─────────────────────────────────────────────────────────────────────────────

# ── ACME challenge (Certbot HTTP-01) — needed before SSL is set up ────────────
# This block handles HTTP for ALL domains during cert issuance
server {
    listen 80;
    server_name datazeb.com www.datazeb.com cms.datazeb.com;

    # Certbot writes challenge files here
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── www → non-www redirect ────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name www.datazeb.com;

    ssl_certificate     /etc/letsencrypt/live/datazeb.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/datazeb.com/privkey.pem;

    return 301 https://datazeb.com$request_uri;
}

# ── Next.js frontend ──────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name datazeb.com;

    ssl_certificate     /etc/letsencrypt/live/datazeb.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/datazeb.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options           "SAMEORIGIN"    always;
    add_header X-Content-Type-Options    "nosniff"       always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;

    # Next.js static assets — immutable cache (content-hashed filenames)
    location /_next/static/ {
        proxy_pass http://nextjs_upstream;
        add_header Cache-Control "public, max-age=31536000, immutable";
        proxy_set_header Host $host;
    }

    # Next.js image optimization
    location /_next/image {
        proxy_pass         http://nextjs_upstream;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # API routes — rate limited
    location /api/ {
        limit_req  zone=api burst=20 nodelay;
        proxy_pass http://nextjs_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── n8n workflow automation ── datazeb.com/automation/ ────────────────────
    location /automation/ {
        proxy_pass         http://n8n_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # n8n workflows can be long-running
    }

    # Everything else → Next.js
    location / {
        limit_req  zone=general burst=60 nodelay;
        limit_conn addr 20;

        proxy_pass         http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 30s;
    }

    # Block hidden files
    location ~ /\. { deny all; }
}

# ── Strapi CMS admin ──────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name cms.datazeb.com;

    ssl_certificate     /etc/letsencrypt/live/datazeb.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/datazeb.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options           "SAMEORIGIN"       always;
    add_header X-Content-Type-Options    "nosniff"          always;

    client_max_body_size 50M;    # Allow large media uploads

    # Optional: restrict admin to your IP only
    # allow YOUR.IP.ADDRESS.HERE;
    # deny all;

    # Strapi uploaded media — served directly from the named volume
    location /uploads/ {
        proxy_pass http://strapi_upstream;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # All other Strapi requests
    location / {
        proxy_pass         http://strapi_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location ~ /\. { deny all; }
}
