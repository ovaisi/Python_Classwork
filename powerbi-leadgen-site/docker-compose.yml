name: datazeb

# ─────────────────────────────────────────────────────────────────────────────
# DataZeb — Docker Compose
#
# Services:
#   postgres  — PostgreSQL 15 database (internal only)
#   strapi    — Strapi v5 CMS  → proxied via system nginx → cms.datazeb.com
#   nextjs    — Next.js 14     → proxied via system nginx → datazeb.com
#
# NOT here (managed separately on the VPS):
#   nginx   → system nginx  (see infra/nginx.conf)
#   certbot → system certbot
#   n8n     → /docker/n8n-rniy/  (separate project, DO NOT TOUCH)
#
# Usage:
#   First time:  docker compose up -d --build
#   Redeploy:    docker compose up -d --build nextjs
#                docker compose up -d --build strapi
#   Logs:        docker compose logs -f
#   Stop:        docker compose down
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: datazeb_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-datazeb_cms}
      POSTGRES_USER:     ${POSTGRES_USER:-strapi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - datazeb_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-strapi} -d ${POSTGRES_DB:-datazeb_cms}"]
      interval: 10s
      timeout:  5s
      retries:  5
    expose:
      - "5432"

  # ── Strapi CMS ──────────────────────────────────────────────────────────────
  strapi:
    build:
      context:    .
      dockerfile: strapi.Dockerfile
    container_name: datazeb_strapi
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV:            production
      HOST:                0.0.0.0
      PORT:                1337

      DATABASE_CLIENT:     postgres
      DATABASE_HOST:       postgres
      DATABASE_PORT:       5432
      DATABASE_NAME:       ${POSTGRES_DB:-datazeb_cms}
      DATABASE_USERNAME:   ${POSTGRES_USER:-strapi}
      DATABASE_PASSWORD:   ${POSTGRES_PASSWORD}
      DATABASE_SSL:        "false"

      APP_KEYS:            ${STRAPI_APP_KEYS}
      API_TOKEN_SALT:      ${STRAPI_API_TOKEN_SALT}
      ADMIN_JWT_SECRET:    ${STRAPI_ADMIN_JWT_SECRET}
      TRANSFER_TOKEN_SALT: ${STRAPI_TRANSFER_TOKEN_SALT}
      JWT_SECRET:          ${STRAPI_JWT_SECRET}

      NEXTJS_URL:          http://nextjs:3000
      REVALIDATE_SECRET:   ${REVALIDATE_SECRET}
    volumes:
      - strapi_uploads:/app/public/uploads
    # Bind to 127.0.0.1 — system nginx proxies cms.datazeb.com → :1337
    ports:
      - "127.0.0.1:1337:1337"
    networks:
      - datazeb_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:1337/_health || exit 1"]
      interval: 30s
      timeout:  10s
      retries:  5
      start_period: 60s

  # ── Next.js Frontend ─────────────────────────────────────────────────────────
  nextjs:
    build:
      context:    .
      dockerfile: nextjs.Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL:      https://datazeb.com
        NEXT_PUBLIC_SITE_NAME:     DataZeb
        NEXT_PUBLIC_CALENDLY_URL:  ${NEXT_PUBLIC_CALENDLY_URL:-https://calendly.com/your-link}
        NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL:-hello@datazeb.com}
    container_name: datazeb_nextjs
    restart: unless-stopped
    depends_on:
      strapi:
        condition: service_healthy
    environment:
      NODE_ENV:          production
      PORT:              3000
      STRAPI_URL:        http://strapi:1337
      STRAPI_TOKEN:      ${STRAPI_TOKEN}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
    # Bind to 127.0.0.1 — system nginx proxies datazeb.com → :3000
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - datazeb_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 20s
      timeout:  5s
      retries:  5
      start_period: 30s

# ── Named Volumes ─────────────────────────────────────────────────────────────
volumes:
  postgres_data:    # PostgreSQL data
  strapi_uploads:   # Strapi media uploads

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  datazeb_net:
    driver: bridge
