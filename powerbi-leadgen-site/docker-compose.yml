name: datazeb

# ─────────────────────────────────────────────────────────────────────────────
# DataZeb — Docker Compose
#
# Services:
#   postgres  — PostgreSQL 15 database
#   strapi    — Strapi v5 CMS (cms.datazeb.com)
#   nextjs    — Next.js 14 frontend (datazeb.com)
#   nginx     — Reverse proxy + SSL termination
#   certbot   — Let's Encrypt SSL cert + auto-renewal
#
# Usage:
#   First time:  docker compose up -d --build
#   Redeploy:    docker compose up -d --build nextjs   (or strapi)
#   Logs:        docker compose logs -f
#   Stop:        docker compose down
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: datazeb_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-datazeb_cms}
      POSTGRES_USER:     ${POSTGRES_USER:-strapi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - datazeb_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-strapi} -d ${POSTGRES_DB:-datazeb_cms}"]
      interval: 10s
      timeout:  5s
      retries:  5
    # Do NOT expose port 5432 to the host — internal only
    expose:
      - "5432"

  # ── Strapi CMS ──────────────────────────────────────────────────────────────
  strapi:
    build:
      context:    .
      dockerfile: strapi.Dockerfile
    container_name: datazeb_strapi
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV:          production
      HOST:              0.0.0.0
      PORT:              1337

      # Database — connects to postgres service by name
      DATABASE_CLIENT:   postgres
      DATABASE_HOST:     postgres          # Docker service name = hostname
      DATABASE_PORT:     5432
      DATABASE_NAME:     ${POSTGRES_DB:-datazeb_cms}
      DATABASE_USERNAME: ${POSTGRES_USER:-strapi}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_SSL:      "false"

      # Strapi secrets — set in .env
      APP_KEYS:            ${STRAPI_APP_KEYS}
      API_TOKEN_SALT:      ${STRAPI_API_TOKEN_SALT}
      ADMIN_JWT_SECRET:    ${STRAPI_ADMIN_JWT_SECRET}
      TRANSFER_TOKEN_SALT: ${STRAPI_TRANSFER_TOKEN_SALT}
      JWT_SECRET:          ${STRAPI_JWT_SECRET}

      # Next.js revalidation webhook
      NEXTJS_URL:        http://nextjs:3000    # Docker service name
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
    volumes:
      - strapi_uploads:/app/public/uploads    # Persist media files
    networks:
      - datazeb_net
    expose:
      - "1337"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:1337/_health || exit 1"]
      interval: 30s
      timeout:  10s
      retries:  5
      start_period: 60s  # Strapi takes time to boot

  # ── Next.js Frontend ─────────────────────────────────────────────────────────
  nextjs:
    build:
      context:    .
      dockerfile: nextjs.Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL:      https://datazeb.com
        NEXT_PUBLIC_SITE_NAME:     DataZeb
        NEXT_PUBLIC_CALENDLY_URL:  ${NEXT_PUBLIC_CALENDLY_URL:-https://calendly.com/your-link}
        NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL:-hello@datazeb.com}
    container_name: datazeb_nextjs
    restart: unless-stopped
    depends_on:
      strapi:
        condition: service_healthy
    environment:
      NODE_ENV:          production
      PORT:              3000

      # Strapi API — connect via Docker service name
      STRAPI_URL:        http://strapi:1337
      STRAPI_TOKEN:      ${STRAPI_TOKEN}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
    networks:
      - datazeb_net
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 20s
      timeout:  5s
      retries:  5
      start_period: 30s

  # ── Nginx Reverse Proxy ──────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: datazeb_nginx
    restart: unless-stopped
    depends_on:
      - nextjs
      - strapi
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
      - nginx_logs:/var/log/nginx
    networks:
      - datazeb_net
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout:  5s
      retries:  3

  # ── Certbot (Let's Encrypt SSL) ──────────────────────────────────────────────
  certbot:
    image: certbot/certbot:latest
    container_name: datazeb_certbot
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    # Runs once then exits — renewal handled by a cron job or docker run
    entrypoint: >
      sh -c "trap exit TERM;
             while :; do
               certbot renew --webroot -w /var/www/certbot --quiet;
               sleep 12h & wait $${!};
             done"
    networks:
      - datazeb_net

# ── Named Volumes ─────────────────────────────────────────────────────────────
volumes:
  postgres_data:    # PostgreSQL data — survives container restarts
  strapi_uploads:   # Strapi media uploads
  certbot_certs:    # SSL certificates from Let's Encrypt
  certbot_webroot:  # ACME challenge files
  nginx_logs:       # Nginx access/error logs

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  datazeb_net:
    driver: bridge
