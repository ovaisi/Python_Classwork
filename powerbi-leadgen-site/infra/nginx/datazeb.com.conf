# ─────────────────────────────────────────────────────────────────────────────
# datazeb.com  → Next.js  (localhost:3000)
# cms.datazeb.com → Strapi (localhost:1337)
#
# Deploy to: /etc/nginx/sites-available/datazeb.com
# SSL certs must exist before loading this file — see deploy-vps.sh
# ─────────────────────────────────────────────────────────────────────────────

limit_req_zone $binary_remote_addr zone=api:10m     rate=30r/m;
limit_req_zone $binary_remote_addr zone=general:10m rate=100r/m;

# ── datazeb.com — Next.js frontend ───────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name datazeb.com www.datazeb.com;
    return 301 https://datazeb.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.datazeb.com;

    ssl_certificate     /etc/letsencrypt/live/datazeb.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/datazeb.com/privkey.pem;

    return 301 https://datazeb.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name datazeb.com;

    ssl_certificate     /etc/letsencrypt/live/datazeb.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/datazeb.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options           "SAMEORIGIN"                          always;
    add_header X-Content-Type-Options    "nosniff"                             always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss text/javascript image/svg+xml;

    location /_next/static/ {
        proxy_pass       http://127.0.0.1:3000;
        add_header       Cache-Control "public, max-age=31536000, immutable";
        proxy_set_header Host $host;
    }

    location /_next/image {
        proxy_pass       http://127.0.0.1:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req        zone=api burst=20 nodelay;
        proxy_pass       http://127.0.0.1:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req          zone=general burst=60 nodelay;
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 30s;
    }

    location ~ /\. { deny all; }
}

# ── cms.datazeb.com — Strapi CMS ─────────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name cms.datazeb.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cms.datazeb.com;

    ssl_certificate     /etc/letsencrypt/live/cms.datazeb.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cms.datazeb.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options           "SAMEORIGIN"       always;
    add_header X-Content-Type-Options    "nosniff"          always;

    client_max_body_size 50M;

    location / {
        proxy_pass         http://127.0.0.1:1337;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location ~ /\. { deny all; }
}
