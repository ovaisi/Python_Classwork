# ─────────────────────────────────────────────────────────────────────────────
# datazeb.cloud — n8n automation
# DO NOT MODIFY — n8n is in production with live workflows
#
# This is an exact copy of the working config on the VPS.
# Deploy to: /etc/nginx/sites-available/datazeb.cloud
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name datazeb.cloud www.datazeb.cloud;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name datazeb.cloud www.datazeb.cloud;

    ssl_certificate     /etc/letsencrypt/live/datazeb.cloud-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/datazeb.cloud-0001/privkey.pem;

    add_header X-Frame-Options        "SAMEORIGIN"    always;
    add_header X-Content-Type-Options "nosniff"       always;
    add_header X-XSS-Protection       "1; mode=block" always;

    location /automation/ {
        proxy_pass         http://localhost:32769/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_read_timeout 3600s;
    }

    root  /var/www/html;
    index index.html;
    location / {
        try_files $uri $uri/ =404;
    }
}
