# ─────────────────────────────────────────────────────────────────────────────
# Nginx configuration for DataZeb
# VPS setup: Next.js (port 3000) + Strapi (port 1337) on same machine
#
# Domains:
#   datazeb.com         → Next.js frontend
#   www.datazeb.com     → Next.js frontend (redirects to non-www)
#   cms.datazeb.com     → Strapi admin panel
#
# Setup:
#   1. Copy to /etc/nginx/sites-available/powerbi
#   2. ln -s /etc/nginx/sites-available/powerbi /etc/nginx/sites-enabled/
#   3. Replace all instances of "datazeb.com" with your actual domain
#   4. Run: certbot --nginx -d datazeb.com -d www.datazeb.com -d cms.datazeb.com
#   5. nginx -t && systemctl reload nginx
# ─────────────────────────────────────────────────────────────────────────────

# Rate limiting zones
limit_req_zone  $binary_remote_addr  zone=api:10m    rate=30r/m;
limit_req_zone  $binary_remote_addr  zone=general:10m rate=100r/m;

# ── Redirect www → non-www ────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name www.datazeb.com;
    return 301 https://datazeb.com$request_uri;
}

# ── Main Frontend — Next.js ───────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name datazeb.com;

    # Certbot will add the HTTPS config here automatically.
    # After running certbot, this block becomes HTTP → HTTPS redirect.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name datazeb.com;

    # SSL — managed by Certbot (Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/datazeb.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/datazeb.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options           "SAMEORIGIN"           always;
    add_header X-Content-Type-Options    "nosniff"              always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss text/javascript image/svg+xml;

    # Static Next.js assets — aggressive cache (fingerprinted filenames)
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        proxy_set_header Host $host;
    }

    # Next.js image optimization endpoint
    location /_next/image {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next.js API routes — rate limited
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # All other requests → Next.js
    location / {
        limit_req zone=general burst=50 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        'upgrade';
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 30s;
    }

    # Block common attack paths
    location ~ /\. {
        deny all;
    }
}

# ── Strapi CMS Admin ─────────────────────────────────────────────────────────
server {
    listen 80;
    server_name cms.datazeb.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name cms.datazeb.com;

    ssl_certificate     /etc/letsencrypt/live/datazeb.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/datazeb.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Restrict admin panel to your IP (recommended)
    # Uncomment and replace with your office/home IP:
    # allow 1.2.3.4;
    # deny all;

    # Security headers
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff"    always;

    client_max_body_size 50M; # Allow large media uploads

    # Strapi static admin panel assets
    location /uploads/ {
        alias /var/www/powerbi/strapi/public/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # All Strapi requests
    location / {
        proxy_pass http://127.0.0.1:1337;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        'upgrade';
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
